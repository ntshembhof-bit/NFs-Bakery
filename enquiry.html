    <meta name="description" content="Submit your enquiries to NF's Bakery. We are here to assist you with any questions or requests regarding our products and services.">

</head>
<body>

    <header>
        <img src="images/logo.png.jpeg" alt="NF's Bakery Logo" width="180px" height="auto">
        
     <h1>NF's Bakery</h1>
     <p><i>Taste Happiness in Every Bite!</i></p>

     <!--===============-->
    <!--Navigation Menu-->
    <!--===============-->
    <nav>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About Us</a></li>

            <li><a href="enquiry.html">Enquiry</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>

    </header>
<main>
    

    <!--========================-->
    <!--Customer Enquiry section-->
    <!--========================-->
    <h2>Make an Enquiry</h2>

    <p>Have a question about our products or want something special?
        Please fill in the enquiry form below.</p>

        <!--============-->
        <!--Enquiry Form-->
        <!--============-->

        <form id="enquiry-form">
            <label for="name">Name:</label>
            <input type="text" id="name" name="name">
            <span class="error-message" id="name-error"></span>
            <br><br>
            <label for="email">Email:</label>
            <input type="email" id="email" name="email">
            <span class="error-message" id="email-error"></span>
            <br><br>

             <!--=================-->
             <!--Product Selection-->
             <!--=================-->

            <label for="order">What would you love to order?</label><br>
            <select type="order" id="order" name="order" >
                 <option value="">--Select a product--</option>
                 <option value="cake">Cake</option>
                 <option value="cupcakes">Cupcakes</option>
                 <option value="cookies">Cookies</option>
                 <option value="Pastries">Pastries</option>
                 <option value="bread">Bread</option>
            </select>
            <span class="error-message" id="order-error"></span>
            <br><br>

           <label for="quantity">How many would you like to order</label><br>
           <input type="number" id="quantity" name="quantity" min="1">
              <span class="error-message" id="quantity-error"></span>
           <br><br>
           <label for="date">Preffered collection date:</label><br>
           <input type="date" id="date" name="date">
           <br><br>
           
           <label for="message">Any other important information?</label><br>
           <textarea id="message" name="message" rows="4" cols="50" ></textarea>
           <span class="error-message" id="message-error"></span>
           <br><br>
           <input type="submit" value="Submit">
        </form>
        <p id="enquiry-response" aria-live="polite"></p>
</main>
        

     <!--================-->   
     <!--Website Footer-->   
     <!--================-->

    <footer>
        <p>&copy; 2026 NF's Bakery. All rights reserved.</p>
    </footer>
</body>

</html>
